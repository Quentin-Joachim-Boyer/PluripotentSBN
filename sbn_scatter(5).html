<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SBN Scatter Plot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0f1117; --panel: #161b27; --border: #252d3d;
    --accent: #4f8ef7; --accent2: #a78bfa;
    --text: #e2e8f0; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 500; }

  .upload-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 5px 12px; border-radius: 6px; font-size: 12px;
    cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .upload-btn:hover { opacity: 0.85; }

  select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); padding: 4px 10px;
    border-radius: 6px; font-size: 12px;
    font-family: 'JetBrains Mono', monospace; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  .controls {
    display: flex; align-items: center; gap: 10px; margin-left: auto;
    font-size: 12px; color: var(--muted);
  }

  .scatter-controls {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
  }
  .scatter-controls label { font-size: 12px; color: var(--muted); }

  .canvas-wrap { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  canvas { width: 100%; height: 100%; display: block; }

  .scatter-legend {
    padding: 5px 16px; background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: flex-start;
    flex-shrink: 0; font-size: 11px; max-height: 80px; overflow-y: auto;
  }
  .scatter-legend-item { display: flex; align-items: center; gap: 5px; }
  .scatter-legend-item:hover { opacity: 0.75 !important; }
  .scatter-legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0; display: inline-block;
  }
  .leg-group { display: inline-flex; flex-direction: column; }
  .leg-group-hdr {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .leg-group-hdr:hover { border-color: var(--muted); }
  .leg-group-body { display: none; flex-wrap: wrap; gap: 3px 10px; padding: 3px 2px 1px; }
  .leg-group-body.open { display: flex; }

  .empty-state {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--muted); font-size: 14px;
  }
  .drop-zone {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 24px 32px; text-align: center; cursor: pointer;
    transition: border-color 0.2s;
  }
  .drop-zone:hover { border-color: var(--accent); color: var(--text); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { display: inline-block; animation: spin 1s linear infinite; }
</style>
</head>
<body>

<header>
  <h1>SBN Scatter Plot</h1>
  <button class="upload-btn" onclick="document.getElementById('file-input').click()">+ Load CSV</button>
  <input type="file" id="file-input" accept=".csv,.gz" multiple style="display:none">
  <div class="controls">
    <select id="file-select"></select>
    <span id="row-count" style="font-family:monospace"></span>
  </div>
</header>

<div class="scatter-controls">
  <label>X axis:</label>
  <select id="scatter-x" onchange="scatterCache=null;showLoading();setTimeout(drawScatter,0)"></select>
  <label style="margin-left:8px">Y axis:</label>
  <select id="scatter-y" onchange="scatterCache=null;showLoading();setTimeout(drawScatter,0)"></select>
  <button id="reset-btn" onclick="resetView()"
          style="display:none;margin-left:auto;background:var(--border);color:var(--text);
                 border:none;padding:3px 10px;border-radius:5px;font-size:11px;
                 cursor:pointer;font-family:inherit">&#8962; Reset</button>
  <span id="loading-indicator" style="font-size:13px;font-weight:600;color:var(--accent);letter-spacing:0.05em"></span>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <div class="empty-state" id="empty-state">
    <div class="drop-zone" onclick="document.getElementById('file-input').click()">
      <div style="font-size:28px;margin-bottom:8px">📂</div>
      <div>Load a CSV file to begin</div>
      <div style="font-size:12px;margin-top:4px;color:var(--muted)">*_output.csv format</div>
    </div>
  </div>
  <canvas id="scatter-canvas"></canvas>
</div>

<div style="display:flex;align-items:stretch;border-top:1px solid var(--border)">
  <div class="scatter-legend" id="scatter-legend" style="border-top:none;flex:1"></div>
  <div style="flex-shrink:0;padding:5px 14px;background:var(--panel);
              border-left:1px solid var(--border);display:flex;align-items:center;gap:10px">
    <span style="font-size:11px;color:var(--muted)">count:</span>
    <canvas id="size-legend-canvas" height="22" style="display:block"></canvas>
    <span id="errbar-toggle" onclick="toggleErrorBars()"
          style="cursor:pointer;font-size:11px;color:var(--text);
                 border:1px solid var(--border);border-radius:4px;
                 padding:2px 8px;white-space:nowrap;user-select:none">
      <span style="display:inline-block;width:14px;height:1.5px;background:currentColor;
                   vertical-align:middle;margin-right:4px"></span>±1 std
    </span>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let files = [];
let curFile = 0;
let selectedVecs = new Set(); // empty = all visible
let scatterCache = null;
let showErrorBars = true;
let view = null;
let dragging = false, dragAnchor = null, viewAtDrag = null;

// ─── CSV Parsing ─────────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const fields = []; let cur = '', inQ = false;
  for (const c of line) {
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
    else { cur += c; }
  }
  fields.push(cur.trim());
  return fields;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = parseCSVLine(lines[0]);
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    header.forEach((h, i) => obj[h] = vals[i] ?? '');
    return obj;
  });
}

// ─── Vec helpers ─────────────────────────────────────────────────────────────
function parseName(name) {
  const mDim = name.match(/^(\d+)d/);
  if (!mDim) return { dim: null, vec: [] };
  const dim = parseInt(mDim[1]);
  const mAngle = name.match(/<([0-9,]+)>/);
  if (mAngle) return { dim, vec: mAngle[1].split(',').map(Number) };
  const rest = name.slice(mDim[0].length).replace(/^_+/, '');
  const mVec = rest.match(/^([0-9][0-9_]*)/);
  if (!mVec) return { dim, vec: [] };
  return { dim, vec: mVec[1].split('_').filter(s => s).map(Number) };
}

function getRowVec(row, fileVec) {
  const vKeys = Object.keys(row).filter(k => /^v_[0-9]+$/.test(k));
  if (!vKeys.length) return fileVec;
  vKeys.sort((a, b) => parseInt(b.slice(2)) - parseInt(a.slice(2)));
  return vKeys.map(k => parseInt(row[k]));
}

function getStatKeys(row) {
  return Object.keys(row).filter(k =>
    !/^v_[0-9]+$/.test(k) && !/^f_[0-9]+$/.test(k) && !/^w_[0-9]+,[0-9]+$/.test(k)
  );
}

// ─── Color ───────────────────────────────────────────────────────────────────
const vecColorCache = new Map();

function vecStrToSum(vecStr) {
  const m = vecStr.match(/[0-9]+/g);
  if (!m) return 1;
  return m.reduce((a, v) => a + parseInt(v), 0);
}

function vecToHyperface(vecStr) {
  const m = vecStr.match(/[0-9]+/g);
  if (!m) return 0;
  for (let i = 0; i < m.length; i++) if (parseInt(m[i]) > 0) return i;
  return 0;
}

function hslToHex(hue, sat, light) {
  const h=hue, s=sat, l=light;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  return '#'+[r+m,g+m,b+m].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
}

// Assign colors by rank in sorted vec list.
// Sorted by sum asc then lex, hue spread 260°->-40° with sqrt distortion.
function assignVecColors(vecStrs) {
  vecColorCache.clear();
  const sorted = Array.from(vecStrs)
    .sort((a, b) => vecStrToSum(a) - vecStrToSum(b) || a.localeCompare(b));
  const total = sorted.length;
  sorted.forEach((vs, i) => {
    const t     = total > 1 ? Math.pow(i / (total - 1), 0.3) : 0;
    const hue   = (220 + t * 300 + 360) % 360;
    const light = 0.30 + (i % 5) * 0.04; // slight variation 0.30-0.46
    vecColorCache.set(vs, hslToHex(hue, 0.75, light));
  });
}

function vecColor(vecStr) {
  return vecColorCache.get(vecStr) ?? '#888888';
}





// ─── File loading ─────────────────────────────────────────────────────────────
async function parseCSVStream(file) {
  const isGzip = file.name.endsWith('.gz');
  let stream = file.stream();
  if (isGzip) stream = stream.pipeThrough(new DecompressionStream('gzip'));

  const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
  let header = null;
  const rows = [];
  let leftover = '';

  // Only keep useful columns: v_*, stat columns (not f_* or w_*)
  // We determine kept indices after reading the header
  let keptIndices = null;

  function parseLine(fields) {
    const obj = {};
    for (const i of keptIndices) obj[header[i]] = fields[i] ?? '';
    return obj;
  }

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = leftover + value;
    const lines = chunk.split(/\r?\n/);
    leftover = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      const fields = parseCSVLine(line);
      if (!header) {
        header = fields;
        // Determine which columns to keep
        keptIndices = header.map((h, i) => i).filter(i => {
          const h = header[i];
          return !/^f_\d+$/.test(h) && !/^w_\d+,\d+$/.test(h);
        });
        continue;
      }
      if (fields.length < header.length) continue;
      rows.push(parseLine(fields));
    }
  }
  if (leftover.trim() && header) {
    const fields = parseCSVLine(leftover);
    if (fields.length >= header.length) rows.push(parseLine(fields));
  }
  return rows;
}

document.getElementById('file-input').addEventListener('change', async e => {
  const fileList = Array.from(e.target.files);
  let loaded = 0;
  for (const file of fileList) {
    // Show loading indicator
    document.getElementById('row-count').textContent = `Loading ${file.name}…`;
    document.getElementById('loading-indicator').innerHTML = '<span class="spinning">⟳</span> loading…';
    try {
      const rows = await parseCSVStream(file);
      if (!rows.length) { loaded++; continue; }
      const { dim, vec } = parseName(file.name.replace('.csv.gz','').replace('.csv',''));
      files.push({ name: file.name, rows, decomp_vec: vec });
      files.sort((a,b) => a.name.localeCompare(b.name));
    } catch(err) {
      console.error('Error loading', file.name, err);
    }
    loaded++;
  }
  if (files.length) {
    curFile = files.length - loaded;
    populateFileSelect();
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('loading-indicator').textContent = '';
    scatterCache = null;
    selectedVecs.clear();
    vecColorCache.clear();
    populateAxes();
    drawScatter();
  }
});

function populateFileSelect() {
  const sel = document.getElementById('file-select');
  sel.innerHTML = '';
  files.forEach((f, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = f.name;
    sel.appendChild(opt);
  });
  sel.value = curFile;
  document.getElementById('row-count').textContent =
    files[curFile].rows.length.toLocaleString() + ' rows';
}

document.getElementById('file-select').addEventListener('change', e => {
  curFile = parseInt(e.target.value);
  vecColorCache.clear();
  selectedVecs.clear();
  scatterCache = null;
  populateAxes();
  drawScatter();
  document.getElementById('row-count').textContent =
    files[curFile].rows.length.toLocaleString() + ' rows';
});

function populateAxes() {
  if (!files.length) return;
  const row = files[curFile].rows[0];
  const stats = getStatKeys(row);
  ['scatter-x','scatter-y'].forEach((id, i) => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = stats.map(k =>
      `<option value="${k}"${k===cur?' selected':''}>${k}</option>`).join('');
    // Default: last two stat columns (x = second-to-last, y = last)
    if (!cur && stats.length > 0) {
      sel.value = stats[stats.length - 2 + i] ?? stats[stats.length - 1];
    }
  });

}

// ─── Scatter drawing ──────────────────────────────────────────────────────────
function drawSizeLegend(minR, maxR, maxCount) {
  const canvas = document.getElementById('size-legend-canvas');
  if (!canvas) return;
  const DPR = window.devicePixelRatio || 1;
  const steps = maxCount === 1 ? [1] : [
    1,
    Math.round(maxCount / 4),
    Math.round(maxCount / 2),
    maxCount
  ].filter((v, i, a) => a.indexOf(v) === i); // deduplicate
  const padding = 6;
  let totalW = padding;
  for (const cnt of steps) {
    const r = minR + (cnt / maxCount) * (maxR - minR);
    totalW += r * 2 + 40 + padding;
  }
  canvas.width  = totalW * DPR;
  canvas.height = 22 * DPR;
  canvas.style.width  = totalW + 'px';
  canvas.style.height = '22px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  ctx.clearRect(0, 0, totalW, 22);
  let x = padding;
  for (const cnt of steps) {
    const r = minR + (cnt / maxCount) * (maxR - minR);
    const cy = 11;
    ctx.beginPath();
    ctx.arc(x + r, cy, r, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(148,163,184,0.5)';
    ctx.strokeStyle = 'rgba(148,163,184,0.9)';
    ctx.lineWidth   = 0.8;
    ctx.fill(); ctx.stroke();
    ctx.fillStyle    = '#94a3b8';
    ctx.font         = '9px JetBrains Mono,monospace';
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'middle';
    const label = cnt >= 1e6 ? (cnt/1e6).toFixed(1)+'M'
                : cnt >= 1e3 ? (cnt/1e3).toFixed(1)+'k'
                : String(Math.round(cnt));
    ctx.fillText(label, x + r * 2 + 3, cy);
    x += r * 2 + 40 + padding;
  }
}

function buildScatterCache() {
  if (!files.length) return false;
  const xKey = document.getElementById('scatter-x')?.value;
  const yKey = document.getElementById('scatter-y')?.value;
  if (!xKey || !yKey) return false;

  const rows = files[curFile].rows;
  const sizeKey = 'GenotypeCount';

  // Single pass: compute bounds + collect vecStrs + build pointMap simultaneously
  let xMin=Infinity, xMax=-Infinity, yMin=Infinity, yMax=-Infinity;
  const allVecStrs = new Set();
  const rawPts = []; // lightweight [x, y, vecStr, weight] tuples

  // Detect which axis is R_P_mean and find matching std column
  const meanAxis = xKey === 'R_P_mean' ? 'x' : yKey === 'R_P_mean' ? 'y' : null;
  const stdKey   = meanAxis ? 'R_P_std' : null;

  for (const row of rows) {
    const x = parseFloat(row[xKey]), y = parseFloat(row[yKey]);
    if (isNaN(x) || isNaN(y)) continue;
    const vec = getRowVec(row, files[curFile].decomp_vec);
    const vecStr = vec ? '<'+vec.join(',')+'>' : '?';
    const weight = parseFloat(row[sizeKey]) || 1;
    const std    = stdKey ? (parseFloat(row[stdKey]) || 0) : 0;
    if (x < xMin) xMin=x; if (x > xMax) xMax=x;
    if (y < yMin) yMin=y; if (y > yMax) yMax=y;
    allVecStrs.add(vecStr);
    rawPts.push(x, y, vecStr, weight, std); // 5 values per point
  }
  if (!rawPts.length) return false;

  // Assign colors in deterministic order
  assignVecColors(allVecStrs);

  // Aggregate into pointMap: 5 sig digits for d<=4, 4 otherwise
  const xRange0 = xMax - xMin || 1, yRange0 = yMax - yMin || 1;
  const sigDigits = files[curFile].rows[0] && Object.keys(files[curFile].rows[0]).filter(k => /^v_\d+$/.test(k)).length <= 4 ? 5 : 4;
  const xPrec = Math.pow(10, Math.floor(Math.log10(xRange0)) - sigDigits);
  const yPrec = Math.pow(10, Math.floor(Math.log10(yRange0)) - sigDigits);
  const pointMap = new Map();
  for (let i = 0; i < rawPts.length; i += 5) {
    const rx = Math.round(rawPts[i]   / xPrec) * xPrec;
    const ry = Math.round(rawPts[i+1] / yPrec) * yPrec;
    const vecStr = rawPts[i+2];
    const weight = rawPts[i+3];
    const std    = rawPts[i+4];
    const key = `${rx}|${ry}|${vecStr}`;
    if (!pointMap.has(key)) pointMap.set(key, { x: rx, y: ry, vecStr, count: 0, std: 0 });
    const entry = pointMap.get(key);
    if (weight > entry.count) entry.count = weight;
    if (std    > entry.std)   entry.std   = std;   // keep max std
  }

  const allPts = Array.from(pointMap.values());
  const maxCount = allPts.reduce((m,p) => p.count>m ? p.count : m, 1);

  const nRows = rows.length;
  const minR = 3.5;
  const maxR = nRows > 500000 ? 10  : nRows > 100000 ? 12 : nRows > 10000 ? 14  : 16;

  // Pre-compute colors and radii
  for (const p of allPts) {
    const col = vecColor(p.vecStr);
    const rgb = parseInt(col.slice(1), 16);
    p.r = (rgb>>16)&255; p.g = (rgb>>8)&255; p.b = rgb&255;
    p.radius = minR + (p.count / maxCount) * (maxR - minR);
  }

  // Sort: largest radius first (drawn behind), then more decomposed on top at equal size
  allPts.sort((a, b) => b.radius - a.radius || vecStrToSum(a.vecStr) - vecStrToSum(b.vecStr));

  const byVec = new Map();
  for (const p of allPts) {
    if (!byVec.has(p.vecStr)) byVec.set(p.vecStr, []);
    byVec.get(p.vecStr).push(p);
  }

  scatterCache = { allPts, byVec, xMin, xMax, yMin, yMax, minR, maxR, maxCount, xKey, yKey, meanAxis };
  view = { xMin, xMax, yMin, yMax };

  // Build legend (only when cache is rebuilt)
  drawSizeLegend(minR, maxR, maxCount);
  buildLegend(byVec);
  return true;
}

function buildLegend(byVec) {
  const legend = document.getElementById('scatter-legend');
  if (!legend) return;
  const allVecs = Array.from(byVec.keys()).sort((a,b) => vecStrToSum(a)-vecStrToSum(b)||a.localeCompare(b));
  const groups = new Map();
  for (const vs of allVecs) {
    const h = vecToHyperface(vs);
    if (!groups.has(h)) groups.set(h, []);
    groups.get(h).push(vs);
  }
  legend.innerHTML = Array.from(groups.entries()).sort((a,b)=>a[0]-b[0]).map(([sum, vecs]) => {
    const swatches = vecs.slice(0,5).map(vs=>
      `<span style="width:7px;height:7px;border-radius:50%;background:${vecColor(vs)};display:inline-block;flex-shrink:0"></span>`
    ).join('');
    const anyActive = selectedVecs.size === 0 || vecs.some(v => selectedVecs.has(v));
    const items = vecs.map(vs => {
      const active = selectedVecs.size === 0 || selectedVecs.has(vs);
      return `<span class="scatter-legend-item" onclick="toggleVec('${vs}')"
               style="cursor:pointer;opacity:${active?1:0.3};transition:opacity 0.15s" data-vec="${vs}">
        <span class="scatter-legend-dot" style="background:${vecColor(vs)}"></span>
        <span style="color:var(--text)">${vs}</span>
      </span>`;
    }).join('');
    return `<span class="leg-group" data-sum="${sum}">
      <span class="leg-group-hdr" onclick="toggleLegGroupSel(${sum})" style="opacity:${anyActive?1:0.35}">
        <span style="display:inline-flex;gap:2px;align-items:center">${swatches}</span>
        <span style="font-size:10px;color:var(--muted)">d=${sum}</span>
        <span style="font-size:10px;color:var(--border)">(${vecs.length})</span>
        <span class="leg-arrow" onclick="event.stopPropagation();toggleLegGroupOpen(${sum})"
              style="font-size:8px;color:var(--muted);padding:0 2px;cursor:pointer;line-height:1">▶</span>
      </span>
      <span class="leg-group-body" id="legbody-${sum}">${items}</span>
    </span>`;
  }).join('');
}

function toggleLegGroupOpen(sum) {
  const body = document.getElementById(`legbody-${sum}`);
  if (!body) return;
  const open = body.classList.toggle('open');
  const arrow = body.previousElementSibling.querySelector('.leg-arrow');
  if (arrow) arrow.textContent = open ? '▼' : '▶';
}

function toggleLegGroupSel(sum) {
  const group = document.querySelector(`.leg-group[data-sum="${sum}"]`);
  if (!group) return;
  const groupVecs = Array.from(group.querySelectorAll('[data-vec]')).map(el => el.getAttribute('data-vec'));
  const allDomVecs = Array.from(document.querySelectorAll('.scatter-legend-item[data-vec]')).map(el => el.getAttribute('data-vec'));
  if (selectedVecs.size === 0) {
    allDomVecs.forEach(v => selectedVecs.add(v));
    groupVecs.forEach(v => selectedVecs.delete(v));
  } else {
    const allInGroup = groupVecs.every(v => selectedVecs.has(v));
    if (allInGroup) groupVecs.forEach(v => selectedVecs.delete(v));
    else groupVecs.forEach(v => selectedVecs.add(v));
    if (selectedVecs.size >= allDomVecs.length) selectedVecs.clear();
  }
  document.querySelectorAll('.scatter-legend-item[data-vec]').forEach(el => {
    const v = el.getAttribute('data-vec');
    el.style.opacity = (selectedVecs.size === 0 || selectedVecs.has(v)) ? '1' : '0.3';
  });
  document.querySelectorAll('.leg-group').forEach(g => {
    const s = parseInt(g.getAttribute('data-sum'));
    const vecs = Array.from(g.querySelectorAll('[data-vec]')).map(el => el.getAttribute('data-vec'));
    const active = selectedVecs.size === 0 || vecs.some(v => selectedVecs.has(v));
    g.querySelector('.leg-group-hdr').style.opacity = active ? '1' : '0.35';
  });
  drawScatter();
}

function toggleErrorBars() {
  showErrorBars = !showErrorBars;
  const btn = document.getElementById('errbar-toggle');
  if (btn) btn.style.opacity = showErrorBars ? '1' : '0.3';
  if (scatterCache) _renderScatter();
}

function showLoading() {
  document.getElementById('loading-indicator').innerHTML =
    '<span class="spinning">⟳</span> computing…';
}

function drawScatter() {
  if (!files.length) return;
  if (!scatterCache) {
    showLoading();
    setTimeout(() => {
      if (!buildScatterCache()) {
        document.getElementById('loading-indicator').textContent = '';
        return;
      }
      document.getElementById('loading-indicator').textContent = '';
      _renderScatter();
    }, 0);
    return;
  }
  _renderScatter();
}

function _renderScatter() {
  const canvas = document.getElementById('scatter-canvas');
  if (!canvas) return;
  const { allPts, xKey, yKey, meanAxis } = scatterCache;
  const { xMin, xMax, yMin, yMax } = view;

  const DPR = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width  = rect.width  * DPR;
  canvas.height = rect.height * DPR;
  canvas.style.width  = rect.width  + 'px';
  canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  const pad=52, xRange=xMax-xMin||1, yRange=yMax-yMin||1;
  const toX = v => pad + (v-xMin)/xRange*(W-2*pad);
  const toY = v => H-pad - (v-yMin)/yRange*(H-2*pad);

  // Grid
  ctx.save();
  const nTicks = 5;
  for (let i=0; i<=nTicks; i++) {
    const vx=xMin+i/nTicks*xRange, vy=yMin+i/nTicks*yRange;
    ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(toX(vx),pad); ctx.lineTo(toX(vx),H-pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad,toY(vy)); ctx.lineTo(W-pad,toY(vy)); ctx.stroke();
    ctx.fillStyle='#64748b'; ctx.font='10px JetBrains Mono,monospace';
    ctx.textAlign='center'; ctx.fillText(fmtTick(vx,xRange),toX(vx),H-pad+14);
    ctx.textAlign='right';  ctx.fillText(fmtTick(vy,yRange),pad-6,toY(vy)+4);
  }
  ctx.fillStyle='#94a3b8'; ctx.font='12px DM Sans,sans-serif';
  ctx.textAlign='center'; ctx.fillText(xKey,W/2,H-4);
  ctx.save(); ctx.translate(14,H/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(yKey,0,0); ctx.restore();
  ctx.restore();

  // Clip points to plot area
  ctx.save();
  ctx.beginPath();
  ctx.rect(pad, pad, W - 2*pad, H - 2*pad);
  ctx.clip();

  // Draw by vec group: least decomposed first (behind), most decomposed last (on top)
  const visiblePts = selectedVecs.size > 0
    ? allPts.filter(p => selectedVecs.has(p.vecStr))
    : allPts;
  // Group by vecStr, sorted by sum ascending (less decomposed drawn first = behind)
  const byVecOrdered = new Map();
  for (const p of visiblePts) {
    if (!byVecOrdered.has(p.vecStr)) byVecOrdered.set(p.vecStr, []);
    byVecOrdered.get(p.vecStr).push(p);
  }
  const sortedVecs = Array.from(byVecOrdered.keys())
    .sort((a, b) => vecStrToSum(a) - vecStrToSum(b));
  for (const vs of sortedVecs) {
    for (const p of byVecOrdered.get(vs)) {
      const cx = toX(p.x), cy = toY(p.y);
      const fill   = `rgba(${p.r},${p.g},${p.b},0.8)`;
      const stroke = `rgba(${p.r},${p.g},${p.b},1)`;
      ctx.lineWidth = 0.8;

      ctx.beginPath();
      ctx.arc(cx, cy, p.radius, 0, Math.PI*2);
      ctx.fillStyle   = fill;
      ctx.strokeStyle = stroke;
      ctx.fill();
      if (p.radius >= 4) ctx.stroke();

      // Draw 1px error bar if std available and enabled
      if (showErrorBars && meanAxis && p.std > 0) {
        const stdPx = meanAxis === 'x'
          ? Math.abs(toX(p.x + p.std) - toX(p.x))
          : Math.abs(toY(p.y - p.std) - toY(p.y));
        ctx.beginPath();
        if (meanAxis === 'x') {
          ctx.moveTo(cx - stdPx, cy);
          ctx.lineTo(cx + stdPx, cy);
        } else {
          ctx.moveTo(cx, cy - stdPx);
          ctx.lineTo(cx, cy + stdPx);
        }
        ctx.strokeStyle = `rgba(${p.r},${p.g},${p.b},0.7)`;
        ctx.lineWidth   = 1;
        ctx.stroke();
      }
    }
  }
  ctx.restore(); // end clip
}

function fmtTick(v, range) {
  const mag = range > 0 ? Math.floor(Math.log10(range)) : 0;
  if (mag >= 4 || mag < -3) return v.toExponential(2);
  return v.toFixed(Math.min(Math.max(0, 2 - mag), 6));
}

function toggleVec(vecStr) {
  if (selectedVecs.has(vecStr)) {
    selectedVecs.delete(vecStr);
  } else {
    selectedVecs.add(vecStr);
  }
  const allDomVecs = Array.from(document.querySelectorAll('.scatter-legend-item[data-vec]')).map(el => el.getAttribute('data-vec'));
  if (selectedVecs.size >= allDomVecs.length) selectedVecs.clear();
  document.querySelectorAll('.scatter-legend-item[data-vec]').forEach(el => {
    const v = el.getAttribute('data-vec');
    el.style.opacity = (selectedVecs.size === 0 || selectedVecs.has(v)) ? '1' : '0.3';
  });
  document.querySelectorAll('.leg-group').forEach(g => {
    const vecs = Array.from(g.querySelectorAll('[data-vec]')).map(el => el.getAttribute('data-vec'));
    const active = selectedVecs.size === 0 || vecs.some(v => selectedVecs.has(v));
    g.querySelector('.leg-group-hdr').style.opacity = active ? '1' : '0.35';
  });
  drawScatter();
}
window.addEventListener('resize', drawScatter);

function resetView() {
  if (!scatterCache) return;
  view = { xMin: scatterCache.xMin, xMax: scatterCache.xMax,
           yMin: scatterCache.yMin, yMax: scatterCache.yMax };
  document.getElementById('reset-btn').style.display = 'none';
  _renderScatter();
}

(function initZoomPan() {
  const canvas = document.getElementById('scatter-canvas');
  const PAD = 52;
  canvas.style.cursor = 'crosshair';

  function markDirty() {
    document.getElementById('reset-btn').style.display = '';
  }

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (!scatterCache || !view) return;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const factor = e.deltaY < 0 ? 1 / 1.2 : 1.2;
    const dataX = view.xMin + (e.offsetX - PAD) / (W - 2*PAD) * (view.xMax - view.xMin);
    const dataY = view.yMax - (e.offsetY - PAD) / (H - 2*PAD) * (view.yMax - view.yMin);
    view.xMin = dataX - (dataX - view.xMin) * factor;
    view.xMax = dataX + (view.xMax - dataX) * factor;
    view.yMin = dataY - (dataY - view.yMin) * factor;
    view.yMax = dataY + (view.yMax - dataY) * factor;
    markDirty();
    _renderScatter();
  }, { passive: false });

  canvas.addEventListener('mousedown', e => {
    if (!scatterCache || !view) return;
    dragging = true;
    dragAnchor = { x: e.offsetX, y: e.offsetY };
    viewAtDrag = { ...view };
    canvas.style.cursor = 'grabbing';
  });

  canvas.addEventListener('mousemove', e => {
    if (!dragging || !viewAtDrag) return;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const dx = (e.offsetX - dragAnchor.x) / (W - 2*PAD) * (viewAtDrag.xMax - viewAtDrag.xMin);
    const dy = (e.offsetY - dragAnchor.y) / (H - 2*PAD) * (viewAtDrag.yMax - viewAtDrag.yMin);
    view.xMin = viewAtDrag.xMin - dx;
    view.xMax = viewAtDrag.xMax - dx;
    view.yMin = viewAtDrag.yMin + dy;
    view.yMax = viewAtDrag.yMax + dy;
    markDirty();
    _renderScatter();
  });

  canvas.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'crosshair'; });
  canvas.addEventListener('mouseleave', () => { dragging = false; canvas.style.cursor = 'crosshair'; });
})();
</script>
